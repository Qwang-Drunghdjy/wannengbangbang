spring:
  application:
    name: backend
  datasource:
    url: >-
      jdbc:mysql://${MYSQL_ADDRESS:localhost:3306}/wannengbangbang
      ?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

jwt:
  # HS256 要求密钥 ≥ 32 字节；生产环境必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:wannengbangbang-dev-secret-please-change-0123456789}
  expire-days: 7

glm:
  # 智谱 GLM-4V-Flash 视觉模型配置；GLM_API_KEY 为空时 AI 接口返回友好错误，其余功能正常
  api-key: ${GLM_API_KEY:}
  model: glm-4v-flash
  base-url: https://open.bigmodel.cn/api/paas/v4
  connect-timeout: 5s
  read-timeout: 30s
  rate-limit-per-minute: 5
