spring:
  application:
    name: backend
  datasource:
    url: >-
      jdbc:mysql://${MYSQL_ADDRESS:localhost:3306}/wannengbangbang
      ?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

jwt:
  # HS256 要求密钥 ≥ 32 字节；生产环境必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:wannengbangbang-dev-secret-please-change-0123456789}
  expire-days: 7
